name: Python pipeline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /requirements*.txt
            /tests/
            /tools/
            /HybridSN卷积模型（flask）/*.py
            /HybridSN卷积模型（flask）/src/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Check training, artifacts and upload contracts
        run: python -m pytest -q tests --junitxml=artifacts/test-results.xml
      - name: Exercise CPU training and loopback HTTP serving
        run: python tools/smoke.py --output artifacts/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-contract-results
          path: |
            artifacts/test-results.xml
            artifacts/smoke/result.json
